# OTiLink 对拷线键鼠共享 —— 配置文件
# 位置：~/.config/otilink/kvm.conf   （可用 --config FILE 指定，--no-config 跳过）
# 语法：键 = 值，# 开头是注释，[段名] 只为可读性（不影响解析）
# 命令行参数优先于本文件。
#
# 默认值参考同类标杆：PowerToys Mouse Without Borders（Easy Mouse / 角部防误切 /
# Ctrl+Alt 系列热键）与 Barrier/Input Leap（热键必须抑制，不能泄漏给对端）。

[general]
# 本机屏幕尺寸（用于撞边判定与坐标换算）。留空/写错会退回 1920x1080。
screen = 1920x1080

# 指针推到边缘多少像素内算"撞边"
edge = 4

# 允许从哪些边把控制权交给对端：left,right,top,bottom 任意组合 | all | none
# none = 只能靠热键切换（最不容易误触）
edges = left,right

# 撞边时必须按住的修饰键（防误触，对标 MWB 的 Easy Mouse 可选 Shift/Ctrl）：
# 空 = 直接撞边就切；可选 shift / ctrl / alt / meta，或组合如 ctrl+alt
switch_modifier =

# 角部死区像素：指针贴在这几个角附近时不触发切换（对标 MWB 的 Block mouse at screen corners）
corner = 40

# 驱动侧时独占本机键鼠（EVIOCGRAB），避免本地与远端双重输入
grab = true

# 剪贴板双向同步
clipboard = true

# 看门狗：驱动侧时若对端超过该毫秒数仍未消费待发数据，自动把控制权交还本机。
# 这是"永远不会被卡住"的兜底。0 = 关闭（不推荐）。
idle_release = 3000

# 保活：周期性 PING（线缆模式额外发一个全零 dummy 帧）。
# 为什么要开：帧管道**空闲几小时**后设备侧会话会卡死 —— 实测症状是
# "用了两个多小时后剪贴板单向不通（W→L 通、L→W 不通），而且拔插也不管用"，
# 因为卡死的是设备侧会话，不是主机句柄。保活让它别闲下来。0 = 关。
keepalive = 5000

# 日志文件（留空 = 输出到终端）
log = /tmp/otikm.log

[hotkeys]
# 写法：修饰键+主键，如 ctrl+alt+space / f12 / ctrl+shift+m；none = 禁用
# 这些热键在**两侧都生效**，并且组合键会被整体抑制（不会在对端留下卡住的 Ctrl/Alt）。
hotkey_toggle    = ctrl+alt+space    # 无条件切换控制权（本机 ⇄ 对端）
hotkey_to_remote = ctrl+alt+right    # 把控制权交给对端
hotkey_to_local  = ctrl+alt+left     # 把控制权拉回本机
hotkey_lock      = ctrl+alt+l        # 锁定/解锁到本机（锁定后撞边不再切换）

[advanced]
# 传输：cable:/dev/sgN（对拷线）。也支持 tcp-listen:PORT / tcp-connect:HOST:PORT 做联调。
# 一般不用写：run-kylin.sh 会传 --transport。
# transport = cable:/dev/sg3

# 输入设备由 run-kylin.sh 自动发现并传 --capture，不建议写死在这里。
# capture = /dev/input/by-id/usb-XXXX-event-kbd
