# OTi WinDroid Linker / VirtualLink 对拷线 (0ea0:2213) 的 usb-storage 复位标志
#
# 为什么：这张“假光盘”（LUN1 = 厂商虚拟光盘 MacKMLink，3.84 MB CDFS）在本机读不出来，
# udev/udisks 反反复复去读它，会把 usb-storage 的内核线程卡在 D 状态（2026-09-22 真机
# 面包屑抓到 953 条 “!!D-state: usb-storage”，而当时 otikm 根本没在跑）→ 整机发卡。
#
# 怎么解：不让内核去枚举 LUN1 就行 —— 用 US_FL_SINGLE_LUN（'s'）强制 max_lun=0，
# 只留 LUN0（Windows 侧的 H:、Linux 侧的 /dev/sdb 那 1MB 共享卷）。
# 内核代码：drivers/usb/storage/usb.c 的 usb_stor_adjust_quirks()（'s' 分支）+
# usb_stor_scan_dwork()（置位时跳过 GET_MAX_LUN 并强制 us->max_lun = 0，5.4 内核已验证）。
#
# ⚠️ 传输通道在同一接口上：我们的键鼠/剪贴板/回程令牌/大文件全走这个 MSC 接口的
#    裸 SCSI 通用设备 /dev/sgN（HID 接口是 Output=0 的纯输入，只能设备→本机）。
#    所以**绝对不能**用“解绑 usb-storage 接口”的办法来隐藏假光盘 —— 那会把 /dev/sgN
#    一起干掉，otikm 只剩 “重开传输失败 / recv rc=-19”（2026-09-22 真机踩过，见 NOTES §62）。
#
# 生效：modprobe.d 只在模块加载时读取。装的时候 usb-storage 往往已加载 →
#       重插线缆或重启；免重启步骤见 re/NOTES.md §62 / re/RUNBOOK.md §10.4。
options usb-storage quirks=0ea0:2213:s
